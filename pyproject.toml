[project]
name = "ai_research_template"
version = "0.1.0"
readme = "README.md"
description = "Is a template for AI research."
requires-python = ">=3.11"
keywords = ["template"]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "PyYAML",
    "pexpect",
    "tensorflow[and-cuda]",
    "sphinx",
    "pytest",
    "coverage",
    "python-dotenv",
    "tflite-runtime",
    "onnxruntime",
    "tf2onnx",
    "tensorflow_model_optimization",
    "tf_keras",
    "optuna",
    "optuna-integration",
    "pyyaml",
    "dill",
    "codecarbon",
    "tf_keras",
    "optuna",
    "optuna-integration",
    "dash",
    "dash-bootstrap-components",
    "pydot",
    "tensorflow-addons",
    "pyedflib"

]


[tool.setuptools]
packages = ["src"]

[project.optional-dependencies]
gui = ["PyQt5", "dash"]
cli = [
  "rich",
  "click",
  "fire"
]
plot =[
    "matplotlib",
    "matplotlib-inline",
    "seaborn",
    "tensorflow-plot",
    "scikit-plot",
    "plotly",
    "pydot",
    "mlflow"
    ]
dev = []

ai = [


]

[tool.project-tools]
pipx_packages = [
    "black",
    "mypy",
    "flake8",
    "flake8-pyproject",
    "isort",
    "optuna-dashboard",
    "jupyterlab",
    "yq"
    ]

[tool.flake8]
max-line-length = 79
max-complexity = 10
exclude = [
    # No need to traverse our git directory
    ".git",
    # There's no value in checking cache directories
    "__pycache__"
]







